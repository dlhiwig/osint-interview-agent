[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-interview-agent"
version = "0.3.0"
description = "AI agent that drafts public-source background research reports for interview prep."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Hiwig", email = "d.l.hiwig@gmail.com" }]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.34",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
osint-agent = "osint_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/osint_agent/prompts" = "osint_agent/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/osint_agent/cli.py" = ["B008"]  # Typer idiom: defaults are function calls
